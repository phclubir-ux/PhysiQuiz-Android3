plugins {
    id 'com.android.application'
}

android {
    namespace 'com.physiquiz.student'
    compileSdk 35

    defaultConfig {
        applicationId 'com.physiquiz.student'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
