name: Build PhysiQuiz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Rebuild Android project structure
        run: |

          mkdir -p app/src/main/java/com/physiquiz/student
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp MainActivity.java app/src/main/java/com/physiquiz/student/
          cp ApiClient.java app/src/main/java/com/physiquiz/student/
          cp AppRemoteConfig.java app/src/main/java/com/physiquiz/student/
          cp PdfActivity.java app/src/main/java/com/physiquiz/student/

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cp strings.xml app/src/main/res/values/
          cp colors.xml app/src/main/res/values/
          cp styles.xml app/src/main/res/values/

          cp network_security_config.xml app/src/main/res/xml/

          cp ic_launcher_background.xml app/src/main/res/drawable/
          cp ic_launcher_foreground.xml app/src/main/res/drawable/

          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
          cp ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/

          cp proguard-rules.pro app/

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "PhysiQuizStudent"
include(":app")
EOF


          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF


          echo "Android project structure:"
          find app -type f


      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug


      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PhysiQuiz.apk
          sha256sum dist/PhysiQuiz.apk > dist/SHA256.txt


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysiQuiz-APK
          path: dist/
          retention-days: 30
