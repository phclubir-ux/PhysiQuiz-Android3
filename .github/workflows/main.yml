name: Build PhysiQuiz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Create Android project structure
        run: |

          mkdir -p app/src/main/java/com/physiquiz/student
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26


          cp MainActivity.java app/src/main/java/com/physiquiz/student/
          cp ApiClient.java app/src/main/java/com/physiquiz/student/
          cp AppRemoteConfig.java app/src/main/java/com/physiquiz/student/
          cp PdfActivity.java app/src/main/java/com/physiquiz/student/


          cp AndroidManifest.xml app/src/main/AndroidManifest.xml


          cp strings.xml app/src/main/res/values/
          cp colors.xml app/src/main/res/values/
          cp styles.xml app/src/main/res/values/


          cp network_security_config.xml app/src/main/res/xml/


          cp ic_launcher_background.xml app/src/main/res/drawable/
          cp ic_launcher_foreground.xml app/src/main/res/drawable/


          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
          cp ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/


          cp proguard-rules.pro app/


          echo "Creating Gradle files"


          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name="PhysiQuizStudent"' \
          'include(":app")' \
          > settings.gradle



          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.7.3' apply false" \
          '}' \
          > build.gradle



          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application'" \
          '}' \
          '' \
          'android {' \
          "    namespace 'com.physiquiz.student'" \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId "com.physiquiz.student"' \
          '        minSdk 24' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName "1.0"' \
          '    }' \
          '' \
          '    buildTypes {' \
          '        debug {' \
          '            minifyEnabled false' \
          '        }' \
          '        release {' \
          '            minifyEnabled false' \
          '        }' \
          '    }' \
          '}' \
          > app/build.gradle



          echo "Project structure:"
          find app -type f



      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug


      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PhysiQuiz.apk
          sha256sum dist/PhysiQuiz.apk > dist/SHA256.txt


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysiQuiz-APK
          path: dist/
          retention-days: 30
